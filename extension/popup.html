<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BrandLedger Guard</title>
  <link rel="stylesheet" href="chatgpt.css">
  <style>
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background-color: #1e293b;
      color: #94a3b8;
      border: 1px solid #475569;
    }
    .input-box {
      width: 100%;
      height: 90px;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      padding: 10px;
      font-size: 13px;
      resize: none;
      outline: none;
    }
    .input-box:focus {
      border-color: #38bdf8;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin: 10px 0;
    }
    button {
      flex: 1;
      background: #0284c7;
      color: white;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .score-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score-number {
      font-size: 24px;
      font-weight: 800;
    }
    .score-high { color: #4ade80; }
    .score-mid { color: #facc15; }
    .score-low { color: #f87171; }
    .claims-list {
      margin-top: 12px;
      max-height: 220px;
      overflow-y: auto;
    }
    .claim-item {
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 12px;
      background: #1e293b;
      border-left: 3px solid #64748b;
    }
    .claim-item.VERIFIED { border-left-color: #22c55e; }
    .claim-item.FLAGGED { border-left-color: #ef4444; }
    .claim-item.ABSTAIN { border-left-color: #eab308; }
    .claim-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 700;
    }
    .badge-VERIFIED { background: #14532d; color: #86efac; }
    .badge-FLAGGED { background: #7f1d1d; color: #fca5a5; }
    .badge-ABSTAIN { background: #713f12; color: #fde047; }
    .fix-box {
      margin-top: 4px;
      background: #0f172a;
      padding: 6px;
      border-radius: 4px;
      color: #38bdf8;
    }
    .source-cite {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-title">
      🛡️ BrandLedger Guard
    </div>
    <span class="tag">Manifest V3</span>
  </div>

  <textarea id="draftText" class="input-box" placeholder="Paste draft or AI generation to verify claims..."></textarea>

  <div class="btn-row">
    <button id="verifyBtn">Verify Claims</button>
    <button id="grabBtn" class="btn-secondary">Grab Selection</button>
  </div>

  <div id="note" style="color:#fca5a5;font-size:12px;margin:4px 0"></div>
  <div id="resultsArea" style="display: none;"><div id="resultsBody" style="max-height:300px;overflow-y:auto"></div></div>
  <div style="margin-top:10px;font-size:11px;color:#94a3b8">API: <span id="host"></span> &middot; <a id="optionsLink" href="#" style="color:#38bdf8">Options</a></div>

  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
